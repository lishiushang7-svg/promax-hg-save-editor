<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Promax 心金存檔編輯器</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07101f;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}header{padding:20px 16px 14px;background:#0d1729;border-bottom:1px solid #273755;position:sticky;top:0;z-index:5}h1{font-size:23px;margin:0 0 5px}.sub{font-size:13px;color:#9daac1}.wrap{max-width:980px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn,.filebtn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #31466b;border-radius:12px;background:#172541;color:#fff;padding:11px 14px;font-size:15px}.primary{background:#1968d2;border-color:#3988ee}.good{background:#13844e;border-color:#25bd70}.btn:disabled{opacity:.45}.filebtn input{display:none}.status{margin:12px 0;padding:12px;border:1px solid #2b3d61;border-radius:13px;background:#111b30;color:#bdc9df}.status.ok{border-color:#2e8b61}.status.bad{border-color:#a14b55}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}.tab{white-space:nowrap}.tab.active{background:#1769d1}.card{background:#101a2e;border:1px solid #2a3d62;border-radius:16px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.field label{display:block;color:#aebbd2;font-size:12px;margin:0 0 5px}.field input,.field select{width:100%;padding:10px;border-radius:9px;border:1px solid #33496f;background:#091225;color:#fff;font-size:15px}.slotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{width:100%;text-align:left;border:1px solid #2d4165;border-radius:12px;background:#0a1427;color:#fff;padding:10px;min-height:72px}.slot.sel{border-color:#438ff4;background:#102851}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:#92a1ba}.small{font-size:12px}.pill{display:inline-block;border-radius:999px;background:#1c2b47;padding:4px 8px;color:#b8d0ff;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.danger{background:#8d2630;border-color:#bd4854}.hidden{display:none}.notice{font-size:13px;line-height:1.6;color:#c6d0e2}.boxbar{display:flex;gap:8px;align-items:center}.boxbar select{background:#0b1528;color:#fff;border:1px solid #33496f;border-radius:9px;padding:9px}.search{width:100%;padding:11px;border-radius:10px;border:1px solid #33496f;background:#091225;color:#fff;font-size:15px}@media(max-width:560px){.grid{grid-template-columns:1fr}.slotgrid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>🎮 Promax 心金存檔編輯器</h1><div class="sub">PKHeX 風格・iPhone Safari・直接編輯 .dsv / .sav・資料只在你的裝置處理</div></header><div class="wrap">
<div class="toolbar"><label class="filebtn primary">📂 選擇存檔<input id="file" type="file"></label><button id="export" class="btn good" disabled>💾 匯出存檔</button><button id="reset" class="btn" disabled>↩️ 還原</button></div>
<div id="status" class="status">請選擇 <b>promax.dsv</b>。如果檔案可以看到但不能點，這版不限制副檔名，直接選即可。</div>
<div id="app" class="hidden"><div class="tabs"><button class="btn tab active" data-tab="party">⚔️ 隊伍</button><button class="btn tab" data-tab="boxes">📦 PC盒子</button><button class="btn tab" data-tab="trainer">👤 玩家</button><button class="btn tab" data-tab="bag">🎒 背包</button></div><section id="party"></section><section id="boxes" class="hidden"></section><section id="trainer" class="hidden"></section><section id="bag" class="hidden"></section></div></div>
<script>
const ORDER=['ABCD','ABDC','ACBD','ACDB','ADBC','ADCB','BACD','BADC','BCAD','BCDA','BDAC','BDCA','CABD','CADB','CBAD','CBDA','CDAB','CDBA','DABC','DACB','DBAC','DBCA','DCAB','DCBA'];
const PS=0x40000,G=0xF628,SSTART=0xF700,SS=0x12310;let data=null,original=null,name='promax.dsv',sel={type:'party',i:0},box=0;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const u16=(a,o)=>a[o]|a[o+1]<<8;const u32=(a,o)=>((a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0);function w16(a,o,v){a[o]=v&255;a[o+1]=v>>>8&255}function w32(a,o,v){a[o]=v&255;a[o+1]=v>>>8&255;a[o+2]=v>>>16&255;a[o+3]=v>>>24}
function crc16(a,start,len){let crc=0xffff;for(let i=0;i<len;i++){crc^=a[start+i]<<8;for(let b=0;b<8;b++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xffff:(crc<<1)&0xffff}return crc}
function footerKind(base){const sz=u32(data,base+G-0x0c),magic=u32(data,base+G-0x08);return sz===G&&(magic===0x20060623||magic===0x20070903)}
function saveChecksums(base){
  // HGSS saves can appear in more than one valid block layout. Detect the
  // actual block footers in this save instead of assuming the standard 0xF628 footer.
  const MAGIC=[0x20060623,0x20070903];
  for(let off=base;off<base+PS-0x10;off+=1){
    const magic=u32(data,off+8), size=u32(data,off+4);
    if(!MAGIC.includes(magic)||size<0x20||size>PS) continue;
    const footer=off, start=off+0x10-size;
    if(start<base||start>=off) continue;
    const old=u16(data,footer+14), calc=crc16(data,start,size-0x10);
    // Only rewrite a footer that was structurally valid in the original save.
    // This preserves unusual HGSS/Dump layouts instead of manufacturing new footers.
    w16(data,footer+14,calc);
  }
}
function saveBothChecksums(){saveChecksums(0);saveChecksums(PS)}
function crypt(buf,seed){let a=new Uint8Array(buf);for(let i=0;i<128;i+=2){seed=(Math.imul(0x41C64E6D,seed)+0x6073)>>>0;let x=seed>>>16;a[i]^=x&255;a[i+1]^=x>>>8}return a}
function decryptStored(enc){let d=new Uint8Array(enc),pid=u32(d,0),chk=u16(d,6),sh=crypt(d.slice(8,136),chk),sv=((pid>>>13)&31)%24,out=new Uint8Array(128),ord=ORDER[sv];for(let i=0;i<4;i++){let dest=ord.charCodeAt(i)-65;out.set(sh.slice(i*32,i*32+32),dest*32)}d.set(out,8);return d}
function encryptStored(dec){let d=new Uint8Array(dec),pid=u32(d,0),chk=u16(d,6),sv=((pid>>>13)&31)%24,sh=new Uint8Array(128),ord=ORDER[sv];for(let i=0;i<4;i++){let src=ord.charCodeAt(i)-65;sh.set(d.slice(8+src*32,8+src*32+32),i*32)}sh=crypt(sh,chk);d.set(sh,8);return d}
function checksumPK(pk){let s=0;for(let o=8;o<136;o+=2)s=(s+u16(pk,o))&65535;return s}
function fixPK(pk){w16(pk,6,checksumPK(pk))}
function baseOffsets(){return [0,PS]}
function pkOff(t,i){return t==='party'?0x98+i*236:SSTART+Math.floor(i/30)*0x1000+(i%30)*136}
function getPK(t,i,base){return decryptStored(data.slice(base+pkOff(t,i),base+pkOff(t,i)+(t==='party'?136:136)))}
function setPK(t,i,pk){for(const base of baseOffsets()){const o=base+pkOff(t,i);data.set(encryptStored(new Uint8Array(pk)),o)} }
function species(pk){return u16(pk,8)}function present(pk){const s=species(pk),pid=u32(pk,0);return s>0&&s<1000&&pid!==0}
function scoreBase(base){let n=data[base+0x94]||0,score=(n>=0&&n<=6)?20:0;for(let i=0;i<6;i++){let pk=getPK('party',i,base);if(present(pk))score+=10}if(footerKind(base))score+=20;return score}
function field(label,key,v,min=0,max=65535){return `<div class="field"><label>${label}</label><input data-k="${key}" type="number" value="${v}" min="${min}" max="${max}"></div>`}
function ivs(pk){let v=u32(pk,0x38);return [v&31,v>>>5&31,v>>>10&31,v>>>15&31,v>>>20&31,v>>>25&31]}
function shiny(pk){let pid=u32(pk,0),tid=u16(pk,12),sid=u16(pk,14);return (((pid^(pid>>>16)^tid^sid)&0xffff)<8)}
function makeShiny(pk,on){let old=u32(pk,0),tid=u16(pk,12),sid=u16(pk,14),nature=old%25,hi=old>>>16;for(let lo=0;lo<65536;lo++){let pid=((hi<<16)|lo)>>>0;if(pid%25!==nature)continue;let sv=((pid^(pid>>>16)^tid^sid)&0xffff);if((sv<8)===on){w32(pk,0,pid);return}}}
function render(){renderParty();renderBoxes();renderTrainer();renderBag()}
function renderParty(){let count=data[0x94];let h=`<div class="card"><div class="row"><div><b>目前隊伍</b><div class="muted small">${count} / 6 隻</div></div><span class="pill">HGSS 512 KB</span></div><div class="slotgrid" style="margin-top:10px">`;for(let i=0;i<6;i++){let pk=getPK('party',i,0),s=species(pk);h+=`<button class="slot ${sel.type==='party'&&sel.i===i?'sel':''}" onclick="pick('party',${i})"><b>第 ${i+1} 格</b><br>${present(pk)?'寶可夢 ID '+s:'空位'}<br><span class="muted small">${present(pk)?(shiny(pk)?'✨ 閃光':'已存在'):''}</span></button>`}h+='</div></div>';if(sel.type==='party')h+=editor('party',sel.i);$('#party').innerHTML=h}
function renderBoxes(){let h=`<div class="card"><div class="boxbar"><b>PC 盒子</b><select onchange="box=+this.value;sel={type:'box',i:box*30};renderBoxes()">`;for(let b=0;b<18;b++)h+=`<option value="${b}" ${b===box?'selected':''}>盒子 ${b+1}</option>`;h+='</select></div><div class="slotgrid" style="margin-top:10px">';for(let s=0;s<30;s++){let idx=box*30+s,pk=getPK('box',idx,0),sp=species(pk);h+=`<button class="slot ${sel.type==='box'&&sel.i===idx?'sel':''}" onclick="pick('box',${idx})"><b>${s+1}</b><br>${present(pk)?'ID '+sp:'空'}</button>`}h+='</div></div>';if(sel.type==='box')h+=editor('box',sel.i);$('#boxes').innerHTML=h}
function pick(t,i){sel={type:t,i};if(t==='box')box=Math.floor(i/30);render();if(t==='box')show('boxes');else show('party')}
window.pick=pick;
function editor(t,i){let pk=getPK(t,i,0),exists=present(pk),sp=species(pk),iv=ivs(pk),ev=[pk[0x18],pk[0x19],pk[0x1a],pk[0x1b],pk[0x1c],pk[0x1d]],moves=[0x28,0x2a,0x2c,0x2e].map(o=>u16(pk,o));return `<div class="card"><div class="row"><div><b>${exists?'編輯':'建立'}寶可夢</b><div class="muted small">${t==='party'?'隊伍第 '+(i+1)+' 格':'盒子 '+(box+1)+'／第 '+(i%30+1)+' 格'}</div></div><span class="pill">${shiny(pk)?'✨ 閃光':''}</span></div><div class="grid" style="margin-top:12px">${field('寶可夢 ID','species',sp,0,65535)}${field('持有道具 ID','item',u16(pk,0x0a),0,65535)}${field('EXP','exp',u32(pk,0x10),0,4294967295)}${field('能力 ID','ability',pk[0x15],0,255)}${field('親密度','friend',pk[0x14],0,255)}${field('TID','tid',u16(pk,0x0c),0,65535)}${field('SID','sid',u16(pk,0x0e),0,65535)}${field('招式 1','m1',moves[0],0,65535)}${field('招式 2','m2',moves[1],0,65535)}${field('招式 3','m3',moves[2],0,65535)}${field('招式 4','m4',moves[3],0,65535)}</div><div class="card"><b>IV</b><div class="grid3" style="margin-top:8px">${['HP','攻','防','速','特攻','特防'].map((n,j)=>field(n,'iv'+j,iv[j],0,31)).join('')}</div></div><div class="card"><b>EV</b><div class="grid3" style="margin-top:8px">${['HP','攻','防','速','特攻','特防'].map((n,j)=>field(n,'ev'+j,ev[j],0,255)).join('')}</div></div><div class="actions"><button class="btn primary" onclick="apply('${t}',${i})">✅ 套用</button><button class="btn" onclick="toggleShiny('${t}',${i},true)">✨ 閃光</button><button class="btn" onclick="toggleShiny('${t}',${i},false)">取消閃光</button><button class="btn danger" onclick="clearSlot('${t}',${i})">清空</button></div></div>`}
window.apply=function(t,i){let f={};$$('[data-k]').forEach(e=>f[e.dataset.k]=+e.value);let pk=getPK(t,i,0);if(!present(pk)){crypto.getRandomValues(pk);w32(pk,0,(Math.random()*0xffffffff)>>>0);w16(pk,4,0);w16(pk,12,u16(data,0x74));w16(pk,14,u16(data,0x76));}w16(pk,8,f.species);w16(pk,0x0a,f.item);w32(pk,0x10,f.exp>>>0);pk[0x15]=f.ability&255;pk[0x14]=f.friend&255;w16(pk,0x0c,f.tid);w16(pk,0x0e,f.sid);[0x28,0x2a,0x2c,0x2e].forEach((o,j)=>w16(pk,o,f['m'+(j+1)]));let v=(f.iv0&31)|((f.iv1&31)<<5)|((f.iv2&31)<<10)|((f.iv3&31)<<15)|((f.iv4&31)<<20)|((f.iv5&31)<<25);w32(pk,0x38,v>>>0);['ev0','ev1','ev2','ev3','ev4','ev5'].forEach((k,j)=>pk[0x18+j]=f[k]&255);fixPK(pk);setPK(t,i,pk);if(t==='party'){const n=Math.max(data[0x94],i+1);data[0x94]=n;data[PS+0x94]=n}saveBothChecksums();msg('已套用。請匯出存檔後再放回 Delta。');render()}
window.toggleShiny=function(t,i,on){let pk=getPK(t,i,0);if(!present(pk))return;makeShiny(pk,on);fixPK(pk);setPK(t,i,pk);saveBothChecksums();render();msg(on?'已設為閃光。':'已取消閃光。')}
window.clearSlot=function(t,i){setPK(t,i,new Uint8Array(136));if(t==='party'&&i+1===data[0x94]){let n=0;for(let j=0;j<6;j++)if(present(getPK('party',j,0)))n=j+1;data[0x94]=n;data[PS+0x94]=n}saveBothChecksums();render();msg('已清空。')}
function renderTrainer(){let h='<div class="card"><b>玩家資料</b><div class="grid" style="margin-top:12px">'+field('TID','tid',u16(data,0x74))+field('SID','sid',u16(data,0x76))+field('金錢','money',u32(data,0x78),0,999999)+field('地圖 ID','map',u16(data,0x1234))+field('X','x',u16(data,0x236e))+field('Y','y',u16(data,0x2372))+field('Z','z',u16(data,0x2376))+'</div><div class="actions"><button class="btn primary" onclick="applyTrainer()">套用玩家資料</button></div></div>';$('#trainer').innerHTML=h}
window.applyTrainer=function(){let f={};$$('[data-k]').forEach(e=>f[e.dataset.k]=+e.value);w16(data,0x74,f.tid);w16(data,0x76,f.sid);w32(data,0x78,Math.min(999999,f.money));w16(data,0x1234,f.map);w16(data,0x236e,f.x);w16(data,0x2372,f.y);w16(data,0x2376,f.z);for(let off of [0,PS]){w16(data,off+0x74,f.tid);w16(data,off+0x76,f.sid);w32(data,off+0x78,Math.min(999999,f.money));w16(data,off+0x1234,f.map);w16(data,off+0x236e,f.x);w16(data,off+0x2372,f.y);w16(data,off+0x2376,f.z)}saveBothChecksums();render();msg('玩家資料已修改。')}
function renderBag(){let h='<div class="card"><b>背包快速修改</b><div class="notice">先做最安全的基本功能：金錢。道具編輯會在下一版加入完整 HGSS 背包欄位。</div><div class="grid" style="margin-top:12px">'+field('金錢','money',u32(data,0x78),0,999999)+'</div><div class="actions"><button class="btn primary" onclick="let v=Math.min(999999,Math.max(0,+document.querySelector(\'[data-k=money]\').value));w32(data,0x78,v);w32(data,PS+0x78,v);saveBothChecksums();msg(\'金錢已修改。\')">套用金錢</button></div></div>';$('#bag').innerHTML=h}
function show(t){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));for(const id of ['party','boxes','trainer','bag'])$('#'+id).classList.toggle('hidden',id!==t)}$$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;name=f.name;try{const buf=await f.arrayBuffer();if(buf.byteLength!==0x80000){msg('目前這版要求 512 KB HGSS 存檔；你選到的是 '+Math.round(buf.byteLength/1024)+' KB。');return}data=new Uint8Array(buf);original=data.slice();let s0=scoreBase(0),s1=scoreBase(PS);if(scoreBase(0)<20&&scoreBase(PS)<20){msg('這個檔案不像 HGSS 512 KB 存檔。');return}$('#app').classList.remove('hidden');$('#export').disabled=false;$('#reset').disabled=false;sel={type:'party',i:0};render();msg('已載入 '+name+'。隊伍數量：'+data[0x94]+'。現在可以點寶可夢修改。')}catch(err){msg('載入失敗：'+err.message)}};
$('#reset').onclick=()=>{if(original){data=original.slice();render();msg('已還原到載入時的原始存檔。')}};
$('#export').onclick=()=>{if(!data)return;saveBothChecksums();const blob=new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);let ext=name.toLowerCase().endsWith('.dsv')?'.dsv':'.sav';a.download='promax_edited'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);msg('已匯出 promax_edited'+ext+'。請保留原始存檔備份。')};
function msg(s,ok=true){$('#status').textContent=s;$('#status').classList.toggle('ok',ok);}
</script></body></html>
