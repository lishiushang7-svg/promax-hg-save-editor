window.apply=async function(t,i){try{var f={};var root=t==='party'?$('#party'):$('#boxes');root.querySelectorAll('[data-k]').forEach(e=>{var k=e.dataset.k;if(k==='species')f[k]=nameToIdValue(e.value,e.dataset.default);else if(k==='item')f[k]=parseResourceValue('item',e.value,e.dataset.default);else if(k==='ability')f[k]=Math.max(0,Math.min(255,+e.value||0));else if(k==='nickname')f[k]=String(e.value||'').trim();else if(/^m[1-4]$/.test(k))f[k]=parseResourceValue('move',e.value,e.dataset.default);else if(/^pp[0-3]$/.test(k))f[k]=Math.max(0,Math.min(63,+e.value||0));else if(/^ppu[0-3]$/.test(k))f[k]=Math.max(0,Math.min(3,+e.value||0));else f[k]=+e.value});if(!f.species||f.species<1||f.species>493)throw Error('寶可夢名稱或編號無效。');var evsum=0;for(var j=0;j<6;j++)evsum+=Math.max(0,Math.min(255,f['ev'+j]||0));if(evsum>510)throw Error('EV 六項總和不能超過 510。');var pk=getPK(t,i,0);if(!present(pk)){
  pk=new Uint8Array(136);

  w16(pk,12,u16(data,0x74));w16(pk,14,u16(data,0x76));pk[0x14]=70;pk[0x17]=2;pk[0x5F]=11;pk[0x83]=4;pk[0x86]=4;pk[0x87]=0;
}var oldShiny=shiny(pk),oldSp=species(pk);await ensureAbilities(f.species);var pi=personalInfo(f.species),romAbilityIds=[pi.ability1,pi.ability2].filter(Boolean);var abilityIds=romAbilityIds.length?romAbilityIds:(speciesAbilities[f.species]||[]),desiredAbility=(f.ability||0)&255,abilityIndex=abilityIds.indexOf(desiredAbility);if(abilityIndex<0)abilityIndex=0;if(!desiredAbility)desiredAbility=abilityIds[0]||0;w16(pk,8,f.species);w16(pk,0x0a,f.item);pk[0x14]=f.friend&255;w16(pk,0x0c,f.tid);w16(pk,0x0e,f.sid);await loadMovePP();for(j=0;j<4;j++){var newMove=f['m'+(j+1)]||0,oldMove=u16(pk,0x28+j*2),oldUps=getPPUp(pk,j),requestedUps=f['ppu'+j]!=null?Math.max(0,Math.min(3,f['ppu'+j])):oldUps;w16(pk,0x28+j*2,newMove);if(!newMove){pk[0x30+j]=0;pk[0x34+j]=0}else{var basePP=await getMoveBasePP(newMove);var ups=(newMove===oldMove?requestedUps:requestedUps||0);pk[0x34+j]=ups;var cap=maxPP(basePP,ups);if(newMove!==oldMove||!present(pk))pk[0x30+j]=cap;else pk[0x30+j]=Math.min(63,Math.min(Math.max(0,pk[0x30+j]),cap));if(f['pp'+j]!=null)pk[0x30+j]=Math.min(63,Math.min(f['pp'+j],cap));}}var v=(f.iv0&31)|((f.iv1&31)<<5)|((f.iv2&31)<<10)|((f.iv3&31)<<15)|((f.iv4&31)<<20)|((f.iv5&31)<<25);w32(pk,0x38,v>>>0);for(j=0;j<6;j++)pk[0x18+j]=Math.max(0,Math.min(255,f['ev'+j]||0));var nat=Math.max(0,Math.min(24,f.nature|0)),level=Math.max(1,Math.min(100,f.level|0));pk[0x84]=level;var expValue=expForLevel(growthRate(f.species),level);w32(pk,0x10,expValue>>>0);if(f.nickname){setNickname(pk,f.nickname)}else if(!present(pk)||oldSp!==f.species){if(!copyNicknameFromExistingSpecies(pk,f.species))clearNickname(pk)}if(!syncNatureAbilityPID(pk,nat,abilityIndex,oldShiny))throw Error('無法同步性格／特性／閃光的 PID。');pk[0x15]=desiredAbility;fixPK(pk);setPK(t,i,pk,t==='party'?level:null);if(t==='party'){data[0x94]=Math.max(data[0x94],i+1);data[PS+0x94]=data[0x94]}else setBoxFlags();var verify=getPK(t,i,0);if(!present(verify)||species(verify)!==f.species)throw Error('寫入後讀回失敗，已停止修改。');if(natureIndex(verify)!==nat)throw Er function renderTrainer(){var h='<div class="card"><b>玩家資料</b><div class="grid" style="margin-top:12px">'+field('TID','tid',u16(data,0x74))+field('SID','sid',u16(data,0x76))+field('金錢','money',u32(data,0x78),0,999999)+field('地圖 ID','map',u16(data,0x1234))+field('X','x',u16(data,0x236E))+field('Y','y',u16(data,0x2372))+field('Z','z',u16(data,0x2376))+'</div><div class="actions"><button class="btn primary" onclick="applyTrainer()">套用玩家資料</button></div></div>';$('#trainer').innerHTML=h}
window.applyTrainer=function(){var f={};$('#trainer').querySelectorAll('[data-k]').forEach(e=>f[e.dataset.k]=+e.value);w16(data,0x74,f.tid);w16(data,0x76,f.sid);w32(data,0x78,Math.min(999999,f.money));w16(data,0x1234,f.map);w16(data,0x236E,f.x);w16(data,0x2372,f.y);w16(data,0x2376,f.z);for(var off of [0,PS]){w16(data,off+0x74,f.tid);w16(data,off+0x76,f.sid);w32(data,off+0x78,Math.min(999999,f.money));w16(data,off+0x1234,f.map);w16(data,off+0x236E,f.x);w16(data,off+0x2372,f.y);w16(data,off+0x2376,f.z)}saveBothChecksums();render();msg('玩家資料已修改。')}
var BAG_BASE=0x644;
var BAG_POCKETS=[
  ['一般物品',BAG_BASE+0x000,165],
  ['重要物品',BAG_BASE+0x294,50],
  ['TM／HM',BAG_BASE+0x35C,101],

function bagPocketByName(name){return BAG_POCKETS.find(p=>p[0]===name)||BAG_POCKETS[0]}
function firstEmptyBagSlot(off,count){for(var i=0;i<count;i++){if(u16(data,off+i*4)===0)return i}return -1}
function renderBag(){
  let h=`<div class="card"><b>🎒 背包</b><div class="notice">已恢復 HGSS 完整背包區段：一般物品、重要物品、TM／HM、郵件、藥品、樹果、球類、戰鬥物品。可修改既有物品，也可直接新增任意物品到第一個空格。</div><div class="grid" style="margin-top:12px"><div class="field"><label>金錢</label><input id="bagMoney" type="number" min="0" max="999999" value="${u32(data,0x78)}"></div><button class="btn primary" onclick="setMoney(document.getElementById('bagMoney').value)">套用金錢</button></div>`;
  for(var p of BAG_POCKETS){
    var name=p[0],off=p[1],count=p[2],entries=[];
    for(var i=0;i<count;i++){var id=u16(data,off+i*4),qty=u16(data,off+i*4+2);if(id||qty)entries.push([i,id,qty])}
    h+=`<div class="card"><div class="row"><div><b>${name}</b><div class="muted small">${entries.length} 格有物品／共 ${count} 格</div></div><button class="btn primary" onclick="addBagItem(${off},${count})">➕ 新增物品</button></div>`;
    if(!entries.length)h+='<div class="notice" style="margin-top:8px">沒有物品；按「新增物品」即可加入。</div>';
    for(var e of entries){var idx=e[0],id=e[1],qty=e[2];h+=`<div class="grid" style="margin-top:8px"><div><b>${esc(itemLabel(id))}</b><div class="muted small">第 ${idx+1} 格｜ID #${id}</div></div><div class="grid3"><div class="field"><label>物品 ID</label><input data-bag-id="${off}:${idx}" type="number" min="0" max="65535" value="${id}"></div><div class="field"><label>數量</label><input data-bag-qty="${off}:${idx}" type="number" min="0" max="999" value="${qty}"></div><button class="btn" onclick="setOneBag(${off},${idx})">套用</button></div></div>`}
    h+='</div>'
  }

}
window.addBagItem=function(off,count){
  try{
    var idx=firstEmptyBagSlot(off,count);if(idx<0)throw Error('這個背包分類已沒有空格。');
    var raw=prompt('輸入物品 ID（例如 1）','1');if(raw===null)return;
    var id=Math.max(1,Math.min(65535,parseInt(raw,10)||0));if(!id)throw Error('物品 ID 無效。');
    var rawQty=prompt('輸入數量','1');if(rawQty===null)return;
    var qty=Math.max(1,Math.min(999,parseInt(rawQty,10)||0));
    for(var base of baseOffsets()){w16(data,base+off+idx*4,id);w16(data,base+off+idx*4+2,qty)}
    saveBothChecksums();render();show('bag');msg('已新增 '+itemLabel(id)+' #'+id+' × '+qty+'。');
  }catch(e){msg(e.message||'新增物品失敗。',false)}
}

for(var id of ['species-list','move-list','item-list','ability-list']){var dl=document.createElement('datalist');dl.id=id;document.body.appendChild(dl)}

Promise.all([loadNames(),loadResources()]).then(()=>{buildSpeciesList();buildResourceLists()});
function show(t){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));for(var id of ['party','boxes','trainer','bag'])$('#'+id).classList.toggle('hidden',id!==t)}$$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
var loadSerial=0;
document.getElementById('file').addEventListener('change',function(e){
  var input=e.target, f=input.files&&input.files[0];
  if(!f)return;
  var serial=++loadSerial;
  // Immediately discard the previous in-memory save so a failed/new load can never show old data.
  data=null; original=null;
  $('#app').classList.add('hidden'); $('#export').disabled=true; $('#reset').disabled=true;
  fileName=f.name;
  msg('正在讀取：'+f.name+'（'+Math.round(f.size/1024)+' KB）…');
  var reader=new FileReader();
  reader.onerror=function(){if(serial!==loadSerial)return;msg('載入失敗：iPad 無法讀取這個檔案。',false);input.value=''};
  reader.onload=function(){
    if(serial!==loadSerial)return;
    try{
      var buf=reader.result;
      if(!buf){msg('讀取失敗：沒有取得檔案內容。',false);return}
      if(buf.byteLength!==0x80000){msg('檔案大小錯誤：需要 512 KB，實際是 '+(buf.byteLength/1024).toFixed(1)+' KB。請確認選的是遊戲的 HGSS 存檔，而不是 ZIP／備份檔。',false);return}
      var fresh=new Uint8Array(buf);
      data=fresh; original=fresh.slice();
      if(!cryptoRoundTripTest()){data=null;original=null;msg('Gen4 PK4 加解密自我測試失敗。',false);return}
      var s0=scoreBase(0),s1=scoreBase(PS);
      if(s0<20&&s1<20){data=null;original=null;msg('這個檔案未通過 HGSS 存檔辨識（兩個存檔區都不像有效資料）。',false);return}
      document.getElementById('app').classList.remove('hidden');document.getElementById('export').disabled=false;document.getElementById('reset').disabled=false;sel={type:'party',i:0};box=0;
      Promise.all([loadNames(),loadResources()]).then(function(){
        if(serial!==loadSerial)return;
        buildSpeciesList();buildResourceLists();render();
        msg('已重新讀取「'+fileName+'」｜'+(f.size/1024).toFixed(0)+' KB｜隊伍：'+data[0x94]+' 隻｜存檔區：'+(s0>=20?'A':'B'));
      }).catch(function(err){
        if(serial!==loadSerial)return;
        buildSpeciesList();buildResourceLists();render();msg('存檔已讀取，但名稱資料載入失敗：'+(err&&err.message?err.message:'未知錯誤'),false);
      });
    }catch(err){data=null;original=null;msg('載入失敗：'+(err&&err.message?err.message:'未知錯誤'),false)}
    finally{input.value=''}
  };
  reader.readAsArrayBuffer(f);
});

$('#reset').onclick=()=>{if(original){data=original.slice();render();msg('已還原到載入時的原始存檔。')}};
$('#export').onclick=()=>{if(!data)return;saveBothChecksums();var blob=new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);var ext=fileName.toLowerCase().endsWith('.dsv')?'.dsv':'.sav';a.download='印魚編輯器_edited'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);msg('已匯出 印魚編輯器_edited'+ext+'。請保留原始存檔備份。')};
function msg(s,ok=true){$('#status').textContent=s;$('#status').classList.toggle('ok',ok);}
