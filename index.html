<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Promax 心金存檔編輯器 v22</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101216;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:14px 16px;background:#171a20;position:sticky;top:0;z-index:10;border-bottom:1px solid #2b3038}
h1{font-size:20px;margin:0 0 5px}.sub{font-size:12px;color:#9aa3af}
main{max-width:1100px;margin:auto;padding:12px}
button,select,input{font:inherit}button{background:#242a33;color:#fff;border:1px solid #3b4350;border-radius:9px;padding:9px 12px;margin:3px;cursor:pointer}
button.primary{background:#315f9f;border-color:#4d83cf}.danger{background:#612f35}
input,select{background:#181c22;color:#fff;border:1px solid #3a414c;border-radius:7px;padding:8px;width:100%}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.status{padding:10px;border-radius:8px;background:#181c22;color:#aeb7c4;margin:8px 0}
.tabs{display:flex;gap:4px;overflow:auto;margin:8px 0}.tabs button.active{background:#315f9f}
.tab{display:none}.tab.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.card{background:#181c22;border:1px solid #2b3038;border-radius:12px;padding:10px}.card h3{font-size:14px;margin:0 0 7px}
.pkgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.slot{min-height:118px;background:#171a20;border:1px solid #303640;border-radius:9px;padding:4px;text-align:center;cursor:pointer}.slot.sel{border-color:#67a0ff;box-shadow:0 0 0 1px #67a0ff inset}.slot img{width:64px;height:64px;image-rendering:auto}.slot small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.boxbtn{margin:2px 0}
.editor{margin-top:10px}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.statrow{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.field label{display:block;font-size:11px;color:#aeb7c4;margin-bottom:3px}.bagrow{display:grid;grid-template-columns:1fr 90px 90px;gap:6px;align-items:center}.hint{font-size:11px;color:#89929f;margin-top:5px}
@media(max-width:600px){.pkgrid{grid-template-columns:repeat(3,1fr)}.boxes{grid-template-columns:repeat(5,1fr)}.statrow{grid-template-columns:repeat(3,1fr)}.row3{grid-template-columns:1fr 1fr}.slot{min-height:105px}.slot img{width:54px;height:54px}}
</style>
</head>
<body>
<header>
<h1>Promax 心金存檔編輯器 v22</h1>
<div class="sub">HGSS 512 KB｜v19 讀取核心修正版 + PC / 玩家 / 背包 + IV / EV / 等級 / 性格</div>
</header>
<main>
<div class="toolbar">
<label><button class="primary" onclick="document.getElementById('file').click()">選擇 DSV 存檔</button></label>
<input id="file" type="file" accept=".dsv,.sav" style="display:none">
<button onclick="exportSave()">匯出 DSV</button>
<button onclick="resetAll()">重新載入原檔</button>
</div>
<div id="status" class="status">請選擇 HGSS 512 KB 存檔。</div>
<div class="tabs">
<button class="active" data-tab="party">隊伍</button><button data-tab="pc">PC盒子</button>
<button data-tab="trainer">玩家</button><button data-tab="bag">背包</button>
</div>

<section id="party" class="tab active"><div id="partyGrid" class="pkgrid"></div></section>
<section id="pc" class="tab">
<div class="toolbar" id="boxBtns"></div>
<div id="pcGrid" class="boxes"></div>
</section>
<section id="trainer" class="tab"><div id="trainerPanel"></div></section>
<section id="bag" class="tab"><div id="bagPanel"></div></section>

<div id="editor" class="editor"></div>
</main>
<script>
const PS=0x40000,G=0xF628,SSTART=0xF700,SS=0x12310;
const PARTY_COUNT=0x94,PARTY_START=0x98,PARTY_STRIDE=236,PC_STRIDE=136;
let original=null,data=null,selType=null,selIndex=-1,box=0;
let speciesNames={},moveNames={},itemNames={},abilityNames={},speciesAbilities={},growthRates={};
const SPECIES_URL="https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/pokemon_species_names.csv";
const MOVE_URL="https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/move_names.csv";
const ITEM_URL="https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/item_names.csv";
const ABILITY_URL="https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/ability_names.csv";
const PA_URL="https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/pokemon_abilities.csv";
const SP_URL="https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/pokemon_species.csv";
const natureNames=["勤奮","怕寂寞","勇敢","固執","頑皮","大膽","坦率","悠閒","淘氣","樂天","膽小","急躁","認真","爽朗","天真","保守","穩重","冷靜","害羞","馬虎","沉著","溫和","冷靜","慎重","浮躁"];
const natureIds=["hardy","lonely","brave","adamant","naughty","bold","docile","relaxed","impish","lax","timid","hasty","serious","jolly","naive","modest","mild","quiet","bashful","rash","calm","gentle","sassy","careful","quirky"];
const statNames=["HP","攻擊","防禦","速度","特攻","特防"];

function u16(a,o){return a[o]|(a[o+1]<<8)} function w16(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255}
function u32(a,o){return (a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0}
function w32(a,o,v){a[o]=v&255;a[o+1]=(v>>>8)&255;a[o+2]=(v>>>16)&255;a[o+3]=(v>>>24)&255}
const ORDER=['ABCD','ABDC','ACBD','ACDB','ADBC','ADCB','BACD','BADC','BCAD','BCDA','BDAC','BDCA','CABD','CADB','CBAD','CBDA','CDAB','CDBA','DABC','DACB','DBAC','DBCA','DCAB','DCBA'];
function crypt(buf,seed){let a=new Uint8Array(buf);for(let i=0;i<128;i+=2){seed=(Math.imul(0x41C64E6D,seed)+0x6073)>>>0;let x=seed>>>16;a[i]^=x&255;a[i+1]^=x>>>8}return a}
function shuffleIndex(pid){return ((pid&0x3E000)>>>13)%24}
function decryptPK(src){let d=src.slice(),pid=u32(d,0),cs=u16(d,6),sh=crypt(d.slice(8,136),cs),out=new Uint8Array(128),ord=ORDER[shuffleIndex(pid)];for(let i=0;i<4;i++){let dest=ord.charCodeAt(i)-65;out.set(sh.slice(i*32,i*32+32),dest*32)}d.set(out,8);return d}
function encryptPK(src){let d=src.slice(),pid=u32(d,0),cs=u16(d,6),sh=new Uint8Array(128),ord=ORDER[shuffleIndex(pid)];for(let i=0;i<4;i++){let srcBlock=ord.charCodeAt(i)-65;sh.set(d.slice(8+srcBlock*32,8+srcBlock*32+32),i*32)}sh=crypt(sh,cs);d.set(sh,8);return d}
function validPK(pk){let sp=u16(pk,8);return sp>=1&&sp<=493&&checksum(pk)===u16(pk,6)}
function pcOffset(i,base){return base+Math.floor(i/30)*0x1000+(i%30)*136}
function pcBase(){let bases=[SSTART,PS+SSTART],scores=[];for(let base of bases){let n=0;for(let i=0;i<540;i++){let pk=decryptPK(data.slice(pcOffset(i,base),pcOffset(i,base)+136));if(validPK(pk))n++}scores.push(n)}return scores[1]>scores[0]?bases[1]:bases[0]}
function pkAt(type,i){if(type==="party"){let n=data[PARTY_COUNT];if(i>=n)return null;return decryptPK(data.slice(PARTY_START+i*PARTY_STRIDE,PARTY_START+i*PARTY_STRIDE+136))}let base=pcBase(),pk=decryptPK(data.slice(pcOffset(i,base),pcOffset(i,base)+136));return validPK(pk)?pk:null}
function setPK(type,i,pk){fixPK(pk);let e=encryptPK(pk);if(type==="party"){data.set(e,PARTY_START+i*PARTY_STRIDE);data.set(e,PS+PARTY_START+i*PARTY_STRIDE)}else{let base=pcBase(),other=base===SSTART?PS+SSTART:SSTART;data.set(e,pcOffset(i,base));data.set(e,pcOffset(i,other))}}
function species(pk){return u16(pk,8)} function item(pk){return u16(pk,10)}
function exp(pk){return u32(pk,16)}
function nature(pk){return u32(pk,0)%25}
function isShiny(pk){let pid=u32(pk,0),tid=u16(pk,12),sid=u16(pk,14);return ((pid>>>16)^(pid&65535)^tid^sid)<8}
function ivs(pk){let x=u32(pk,0x38);return [x&31,(x>>>5)&31,(x>>>10)&31,(x>>>15)&31,(x>>>20)&31,(x>>>25)&31]}
function setIVs(pk,a){let x=0;for(let i=0;i<6;i++)x|=(Math.max(0,Math.min(31,a[i]|0))<<(i*5));w32(pk,0x38,x>>>0)}
function evs(pk){return [...pk.slice(0x18,0x1e)]} function setEVs(pk,a){for(let i=0;i<6;i++)pk[0x18+i]=Math.max(0,Math.min(255,a[i]|0))}
function getMoves(pk){return [u16(pk,0x28),u16(pk,0x2a),u16(pk,0x2c),u16(pk,0x2e)]}
function setMoves(pk,a){for(let i=0;i<4;i++)w16(pk,0x28+i*2,a[i]|0)}
function abilityList(sp){return speciesAbilities[sp]||[]}
function abilitySlot(pk,sp){let list=abilityList(sp);let a=pk[0x15];let j=list.indexOf(a);return j>=0?Math.min(j,1):0}
function pidWithProps(nat,slot,tid,sid,shiny){
  for(let tries=0;tries<2500;tries++){
    let hi=Math.floor(Math.random()*65536), r=(nat-((hi*65536)%25)+25)%25, base=-1;
    for(let b=0;b<50;b++)if(b%25===r&&b%2===slot){base=b;break}
    if(base<0)continue;
    for(let k=0;k<1311;k++){
      let lo=base+50*k;if(lo>65535)break;
      let pid=((hi<<16)|lo)>>>0,x=((pid>>>16)^(pid&65535)^tid^sid)>>>0;
      if((x<8)===shiny)return pid;
    }
  }
  return null;
}
function syncPID(pk,nat,slot,shiny){let tid=u16(pk,12),sid=u16(pk,14),p=pidWithProps(nat,slot,tid,sid,shiny);if(p===null)throw Error("PID 生成失敗");w32(pk,0,p)}
function makeShiny(pk,on){syncPID(pk,nature(pk),abilitySlot(pk,species(pk)),on)}
function levelFromExp(g,x){for(let l=100;l>=1;l--)if(expForLevel(g,l)<=x)return l;return 1}
function expForLevel(g,l){
 l=Math.max(1,Math.min(100,l));let n=l,n3=n*n*n;
 if(g===1)return Math.floor(1.25*n3);
 if(g===2)return Math.floor(1.2*n3-15*n*n+100*n-140);
 if(g===3)return Math.floor(.8*n3);
 if(g===5){if(n<=50)return Math.floor(n3*(100-n)/50);if(n<=68)return Math.floor(n3*(150-n)/100);if(n<=98)return Math.floor(n3*Math.floor((1911-10*n)/3)/500);return Math.floor(n3*(160-n)/100)}
 if(g===6){if(n<=15)return Math.floor(n3*Math.floor((n+1)/3+24)/50);if(n<=35)return Math.floor(n3*(n+14)/50);return Math.floor(n3*Math.floor(n/2+32)/50)}
 return n3;
}
function growth(sp){return Number(growthRates[sp]||4)}
function parseCSVLine(line){let out=[],cur="",q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=""}else cur+=c}out.push(cur);return out}
async function loadCSV(url,fn){try{let t=await fetch(url).then(r=>r.text()),ls=t.split(/\r?\n/);for(let i=1;i<ls.length;i++){if(!ls[i])continue;let c=parseCSVLine(ls[i]);fn(c)}}catch(e){console.warn(url,e)}}
async function loadResources(){
 await Promise.all([
  loadCSV(SPECIES_URL,c=>{if(c[0]&&c[2]==="12")speciesNames[+c[1]]=c[3]}),
  loadCSV(MOVE_URL,c=>{if(c[0]&&c[2]==="12")moveNames[+c[1]]=c[3]}),
  loadCSV(ITEM_URL,c=>{if(c[0]&&c[2]==="12")itemNames[+c[1]]=c[3]}),
  loadCSV(ABILITY_URL,c=>{if(c[0]&&c[2]==="12")abilityNames[+c[1]]=c[3]}),
  loadCSV(PA_URL,c=>{let sp=+c[0],ab=+c[1],slot=+c[2];if(sp<=493){(speciesAbilities[sp]??=[]).push({id:ab,slot})}}),
  loadCSV(SP_URL,c=>{let id=+c[0],gr=c[10];if(id<=493&&gr)growthRates[id]=gr})
 ]);
 for(let sp in speciesAbilities)speciesAbilities[sp].sort((a,b)=>a.slot-b.slot);
}
function nameOf(map,id,fallback){return map[id]||fallback+" #"+id}
function sprite(sp,sh=false){return "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/"+(sh?"shiny/":"")+sp+".png"}
function setStatus(t,err=false){let s=document.getElementById("status");s.textContent=t;s.style.color=err?"#ff8d8d":"#aeb7c4"}
function validSave(){return data&&data.length===524288}
function render(){if(!validSave())return;document.getElementById("partyGrid").innerHTML=Array.from({length:6},(_,i)=>slotHTML("party",i)).join("");document.getElementById("pcGrid").innerHTML=Array.from({length:30},(_,i)=>slotHTML("pc",box*30+i)).join("");document.getElementById("boxBtns").innerHTML=Array.from({length:18},(_,i)=>`<button class="boxbtn ${i===box?"primary":""}" onclick="box=${i};render()">${i+1}</button>`).join("");renderTrainer();renderBag();if(selType)showEditor(selType,selIndex)}
function slotHTML(type,i){
 let pk=pkAt(type,i),sel=(selType===type&&selIndex===i)?"sel":"";
 if(!pk)return `<div class="slot ${sel}" onclick="selectSlot('${type}',${i})"><small>空位</small></div>`;
 let sp=species(pk),nm=nameOf(speciesNames,sp,"寶可夢");
 return `<div class="slot ${sel}" onclick="selectSlot('${type}',${i})"><img src="${sprite(sp,isShiny(pk))}" onerror="this.style.visibility='hidden'"><small>${nm}</small><small>#${sp}</small></div>`;
}
function selectSlot(type,i){selType=type;selIndex=i;showEditor(type,i)}
function resourceSelect(map,val,cls,placeholder){
 let opts=Object.keys(map).sort((a,b)=>a-b).map(k=>`<option value="${k}" ${+k===val?"selected":""}>${map[k]} (#${k})</option>`).join("");
 return `<select class="${cls}"><option value="0">${placeholder}</option>${opts}</select>`;
}
function showEditor(type,i){
 let pk=pkAt(type,i);if(!pk){document.getElementById("editor").innerHTML="";return}
 let sp=species(pk),ivs0=ivs(pk),evs0=evs(pk),moves=getMoves(pk),alist=abilityList(sp),curAb=pk[0x15];
 let abilityOpts=alist.map((a,j)=>`<option value="${a.id}" ${a.id===curAb?"selected":""}>${abilityNames[a.id]||("特性 #"+a.id)}</option>`).join("");
 let moveOpts=moves.map((m,j)=>`<div class="field"><label>招式 ${j+1}</label>${resourceSelect(moveNames,m,"move"+j,"不變更/無")}</div>`).join("");
 let itemOpts=resourceSelect(itemNames,item(pk),"helditem","選擇持有物");
 document.getElementById("editor").innerHTML=`
 <div class="card">
 <h3>${type==="party"?"隊伍":"PC"} 第 ${type==="party"?i+1:i%30+1} 格｜${nameOf(speciesNames,sp,"寶可夢")} #${sp}</h3>
 <div class="row3">
  <div class="field"><label>寶可夢（中文名稱或編號）</label><input id="species" value="${nameOf(speciesNames,sp,"")}"></div>
  <div class="field"><label>等級</label><input id="level" type="number" min="1" max="100" value="${levelFromExp(growth(sp),exp(pk))}"></div>
  <div class="field"><label>性格</label><select id="nature">${natureNames.map((n,j)=>`<option value="${j}" ${j===nature(pk)?"selected":""}>${n}</option>`).join("")}</select></div>
 </div>
 <div class="row3">
  <div class="field"><label>特性</label><select id="ability">${abilityOpts}</select></div>
  <div class="field"><label>持有物</label>${itemOpts}</div>
  <div class="field"><label>EXP（依等級套用）</label><input id="expview" readonly value="${exp(pk)}"></div>
 </div>
 <div class="card" style="margin-top:8px"><h3>IV</h3><div class="statrow">${ivs0.map((v,j)=>`<div class="field"><label>${statNames[j]}</label><input id="iv${j}" type="number" min="0" max="31" value="${v}"></div>`).join("")}</div><button onclick="sixIV()">6V</button></div>
 <div class="card" style="margin-top:8px"><h3>EV</h3><div class="statrow">${evs0.map((v,j)=>`<div class="field"><label>${statNames[j]}</label><input id="ev${j}" type="number" min="0" max="255" value="${v}"></div>`).join("")}</div><button onclick="clearEV()">清除 EV</button><div class="hint">EV 六項總和不可超過 510。</div></div>
 <div class="card" style="margin-top:8px"><h3>招式</h3><div class="row">${moveOpts}</div></div>
 <div class="toolbar">
  <button class="primary" onclick="applyEdit('${type}',${i})">套用修改</button>
  <button onclick="toggleShiny('${type}',${i})">${isShiny(pk)?"取消閃光":"變成閃光"}</button>
  <button class="danger" onclick="clearSlot('${type}',${i})">清除這格</button>
 </div>
 <div class="hint">更換寶可夢時會自動保留閃光狀態、性格與有效特性組合，並重新同步 PID。</div>
 </div>`;
}
function nameToId(v,map){v=String(v).trim();if(/^\\d+$/.test(v))return +v;for(let k in map)if(map[k]===v)return +k;return null}
function sixIV(){for(let i=0;i<6;i++)document.getElementById("iv"+i).value=31}
function clearEV(){for(let i=0;i<6;i++)document.getElementById("ev"+i).value=0}
function refreshAbilityForSpecies(sp){
 let a=abilityList(sp),el=document.getElementById("ability");if(!el)return;
 el.innerHTML=a.map(x=>`<option value="${x.id}">${abilityNames[x.id]||("特性 #"+x.id)}</option>`).join("");
}
document.addEventListener("change",e=>{if(e.target.id==="species"){let sp=nameToId(e.target.value,speciesNames);if(sp&&sp>=1&&sp<=493)refreshAbilityForSpecies(sp)}})
function applyEdit(type,i){
 try{
  let pk=pkAt(type,i);if(!pk)throw Error("這一格是空的，請先選有寶可夢的格子。");
  let oldSp=species(pk),sp=nameToId(document.getElementById("species").value,speciesNames);
  if(!sp||sp<1||sp>493)throw Error("寶可夢名稱或編號無效。");
  let a=[],ev=[];for(let j=0;j<6;j++){a.push(+document.getElementById("iv"+j).value);ev.push(+document.getElementById("ev"+j).value)}
  if(ev.reduce((x,y)=>x+y,0)>510)throw Error("EV 總和不能超過 510。");
  let nat=+document.getElementById("nature").value,lev=Math.max(1,Math.min(100,+document.getElementById("level").value||1));
  let newAbilities=abilityList(sp),chosenAb=+(document.getElementById("ability").value||0);
  if(!newAbilities.some(x=>x.id===chosenAb))chosenAb=newAbilities[0]?.id||0;
  pk[0x15]=chosenAb;
  let slot=newAbilities.length>1?Math.max(0,newAbilities.findIndex(x=>x.id===chosenAb)):0;
  w32(pk,16,expForLevel(growth(sp),lev));
  w16(pk,8,sp);setIVs(pk,a);setEVs(pk,ev);
  let itemv=+(document.querySelector("#editor select.helditem")?.value||0);w16(pk,10,itemv);
  let mv=[];for(let j=0;j<4;j++){let el=document.querySelector("#editor select.move"+j);let v=el?+el.value:getMoves(pk)[j];mv.push(v)};setMoves(pk,mv);
  syncPID(pk,nat,slot,isShiny(pk));pk[0x15]=chosenAb;fixPK(pk);setPK(type,i,pk);
  setStatus(`已套用：${nameOf(speciesNames,sp,"寶可夢")} #${sp}｜等級 ${lev}｜${isShiny(pk)?"閃光":"普通"}。`);
  render();
 }catch(e){setStatus(e.message||String(e),true)}
}
function toggleShiny(type,i){try{let pk=pkAt(type,i);let on=!isShiny(pk);let sp=species(pk),list=abilityList(sp),ab=pk[0x15],slot=Math.max(0,list.findIndex(x=>x.id===ab));if(slot>1)slot=0;syncPID(pk,nature(pk),slot,on);fixPK(pk);setPK(type,i,pk);setStatus(on?"已變成閃光。":"已取消閃光。");render()}catch(e){setStatus(e.message,true)}}
function clearSlot(type,i){if(!confirm("確定清除這一格？"))return;if(type==="party"){let n=data[PARTY_COUNT];if(i<n){for(let j=i;j<n-1;j++)data.set(data.slice(PARTY_START+(j+1)*PARTY_STRIDE,PARTY_START+(j+2)*PARTY_STRIDE),PARTY_START+j*PARTY_STRIDE);data[PARTY_COUNT]=Math.max(0,n-1)}}else{let o=SSTART+Math.floor(i/30)*0x1000+(i%30)*136;data.fill(0,o,o+136)}selType=null;selIndex=-1;render()}
function renderTrainer(){let tid=u16(data,0x74),sid=u16(data,0x76),money=u32(data,0x78),map=u16(data,0x1234),x=u16(data,0x236e),y=u16(data,0x2372),z=u16(data,0x2376);document.getElementById("trainerPanel").innerHTML=`<div class="card"><h3>玩家資料</h3><div class="row3"><div class="field"><label>TID</label><input id="tid" type="number" value="${tid}"></div><div class="field"><label>SID</label><input id="sid" type="number" value="${sid}"></div><div class="field"><label>金錢</label><input id="money" type="number" value="${money}"></div><div class="field"><label>地圖 ID</label><input id="map" type="number" value="${map}"></div><div class="field"><label>X</label><input id="x" type="number" value="${x}"></div><div class="field"><label>Y</label><input id="y" type="number" value="${y}"></div><div class="field"><label>Z</label><input id="z" type="number" value="${z}"></div></div><button class="primary" onclick="applyTrainer()">套用玩家資料</button></div>`}
function bagPockets(){return [["一般物品",0x644,165],["重要物品",0x8d8,43],["TM / HM",0x9a4,100],["郵件",0xb34,12],["藥品",0xb64,40],["樹果",0xc04,64],["球類",0xd04,24],["戰鬥物品",0xd64,30]]}
function renderBag(){let h='<div class="card"><h3>🎒 背包</h3><div class="hint">顯示 HGSS 存檔中所有非空物品欄位。</div>';for(let [name,off,count] of bagPockets()){let es=[];for(let i=0;i<count;i++){let o=off+i*4,id=u16(data,o),qty=u16(data,o+2);if(id||qty)es.push([i,id,qty])}h+=`<div class="card"><h3>${name} <span class="hint">${es.length} 格</span></h3>`;if(!es.length)h+='<div class="hint">沒有物品</div>';for(let [i,id,qty] of es){let nm=itemNames[id]||('道具 #'+id);h+=`<div class="bagrow"><div><b>${nm}</b><div class="hint">ID #${id}｜第 ${i+1} 格</div></div><input id="bid_${off}_${i}" type="number" value="${id}"><input id="bq_${off}_${i}" type="number" value="${qty}"></div>`}if(es.length)h+=`<button class="primary" onclick="applyBagPocket(${off},${count})">套用 ${name}</button>`;h+='</div>'}h+='</div>';document.getElementById("bagPanel").innerHTML=h}
window.applyTrainer=function(){let f={tid:Math.max(0,Math.min(65535,+document.getElementById('tid').value||0)),sid:Math.max(0,Math.min(65535,+document.getElementById('sid').value||0)),money:Math.max(0,Math.min(999999,+document.getElementById('money').value||0)),map:+document.getElementById('map').value||0,x:+document.getElementById('x').value||0,y:+document.getElementById('y').value||0,z:+document.getElementById('z').value||0};for(let off of [0,PS]){w16(data,off+0x74,f.tid);w16(data,off+0x76,f.sid);w32(data,off+0x78,f.money);w16(data,off+0x1234,f.map);w16(data,off+0x236e,f.x);w16(data,off+0x2372,f.y);w16(data,off+0x2376,f.z)}saveBothChecksums();render();setStatus('玩家資料已套用。')}
window.applyBagPocket=function(off,count){for(let i=0;i<count;i++){let a=document.getElementById(`bid_${off}_${i}`),q=document.getElementById(`bq_${off}_${i}`);if(!a||!q)continue;let id=Math.max(0,Math.min(65535,+a.value||0)),qty=Math.max(0,Math.min(999,+q.value||0));for(let base of [0,PS]){w16(data,base+off+i*4,id);w16(data,base+off+i*4+2,qty)}}saveBothChecksums();render();setStatus('背包物品已套用。')}
function resetAll(){if(original){data=original.slice();selType=null;selIndex=-1;render();setStatus("已還原原始存檔。")}}
function exportSave(){if(validSave())saveBothChecksums();if(!validSave()){setStatus("請先載入存檔。",true);return}let blob=new Blob([data],{type:"application/octet-stream"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Promax_HG_v21_edited.dsv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById(b.dataset.tab).classList.add("active")})
document.getElementById("file").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let b=new Uint8Array(await f.arrayBuffer());if(b.length!==524288)throw Error("目前只接受 512 KB HGSS DSV/SAV。");original=b.slice();data=b.slice();let n=data[PARTY_COUNT];setStatus(`已載入 ${f.name}。隊伍數量：${n}。`);render()}catch(x){setStatus(x.message,true)}}
(async()=>{await loadResources();setStatus("v22 資源載入完成，已修正 Gen4 PK 加解密與 PC / 玩家 / 背包讀取。請選擇 HGSS 512 KB 存檔。")})();
</script>
