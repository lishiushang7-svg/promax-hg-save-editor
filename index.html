</style></head><body><header><h1>🎮 Promax 心金存檔編輯器</h1><div class="sub">PKHeX 風格・iPhone Safari・圖片＋繁中名稱・招式／道具／特性可用名稱選擇・資料只在你的裝置處理</div></header><div class="wrap">

<script>
var ORDER=['ABCD','ABDC','ACBD','ACDB','ADBC','ADCB','BACD','BADC','BCAD','BCDA','BDAC','BDCA','CABD','CADB','CBAD','CBDA','CDAB','CDBA','DABC','DACB','DBAC','DBCA','DCAB','DCBA'];
var PS=0x40000,G=0xF628,SSTART=0xF700,SS=0x12310;var data=null,original=null,fileName='promax.dsv',sel={type:'party',i:0},box=0;
var $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];var u16=(a,o)=>a[o]|a[o+1]<<8;var u32=(a,o)=>((a[o]|a[o+1]<<8|a[o+2]<<16|a[o+3]<<24)>>>0);function w16(a,o,v){a[o]=v&255;a[o+1]=v>>>8&255}function w32(a,o,v){a[o]=v&255;a[o+1]=v>>>8&255;a[o+2]=v>>>16&255;a[o+3]=v>>>24}
function crc16(a,start,len){var crc=0xffff;for(var i=0;i<len;i++){crc^=a[start+i]<<8;for(var b=0;b<8;b++)crc=(crc&0x8000)?((crc<<1)^0x1021)&0xffff:(crc<<1)&0xffff}return crc}
function footerKind(base){var sz=u32(data,base+G-0x0c),magic=u32(data,base+G-0x08);return sz===G&&(magic===0x20060623||magic===0x20070903)}
function saveChecksums(base){
  // HGSS saves can appear in more than one valid block layout. Detect the
  // actual block footers in this save instead of assuming the standard 0xF628 footer.
  var MAGIC=[0x20060623,0x20070903];
  for(var off=base;off<base+PS-0x10;off+=1){
    var magic=u32(data,off+8), size=u32(data,off+4);
    if(!MAGIC.includes(magic)||size<0x20||size>PS) continue;
    var footer=off, start=off+0x10-size;
    if(start<base||start>=off) continue;
    var old=u16(data,footer+14), calc=crc16(data,start,size-0x10);
    // Only rewrite a footer that was structurally valid in the original save.
    // This preserves unusual HGSS/Dump layouts instead of manufacturing new footers.
    w16(data,footer+14,calc);
  }
}
function saveBothChecksums(){saveChecksums(0);saveChecksums(PS)}
function crypt(buf,seed){var a=new Uint8Array(buf);for(var i=0;i<128;i+=2){seed=(Math.imul(0x41C64E6D,seed)+0x6073)>>>0;var x=seed>>>16;a[i]^=x&255;a[i+1]^=x>>>8}return a}
function decryptStored(enc){var d=new Uint8Array(enc),pid=u32(d,0),chk=u16(d,6),sh=crypt(d.slice(8,136),chk),sv=((pid>>>13)&31)%24,out=new Uint8Array(128),ord=ORDER[sv];for(var i=0;i<4;i++){var dest=ord.charCodeAt(i)-65;out.set(sh.slice(i*32,i*32+32),dest*32)}d.set(out,8);return d}
function encryptStored(dec){var d=new Uint8Array(dec),pid=u32(d,0),chk=u16(d,6),sv=((pid>>>13)&31)%24,sh=new Uint8Array(128),ord=ORDER[sv];for(var i=0;i<4;i++){var src=ord.charCodeAt(i)-65;sh.set(d.slice(8+src*32,8+src*32+32),i*32)}sh=crypt(sh,chk);d.set(sh,8);return d}
function checksumPK(pk){var s=0;for(var o=8;o<136;o+=2)s=(s+u16(pk,o))&65535;return s}
function fixPK(pk){w16(pk,6,checksumPK(pk))}
function baseOffsets(){return [0,PS]}
function pkOff(t,i){return t==='party'?0x98+i*236:SSTART+Math.floor(i/30)*0x1000+(i%30)*136}
function getPK(t,i,base){return decryptStored(data.slice(base+pkOff(t,i),base+pkOff(t,i)+(t==='party'?136:136)))}
function setPK(t,i,pk){for(var base of baseOffsets()){var o=base+pkOff(t,i);data.set(encryptStored(new Uint8Array(pk)),o)} }
function species(pk){return u16(pk,8)}function present(pk){var s=species(pk),pid=u32(pk,0);return s>0&&s<1000&&pid!==0}
function scoreBase(base){var n=data[base+0x94]||0,score=(n>=0&&n<=6)?20:0;for(var i=0;i<6;i++){var pk=getPK('party',i,base);if(present(pk))score+=10}if(footerKind(base))score+=20;return score}
function field(label,key,v,min=0,max=65535){return `<div class="field"><label>${label}</label><input data-k="${key}" type="number" value="${v}" min="${min}" max="${max}"></div>`}
function ivs(pk){var v=u32(pk,0x38);return [v&31,v>>>5&31,v>>>10&31,v>>>15&31,v>>>20&31,v>>>25&31]}
function shiny(pk){var pid=u32(pk,0),tid=u16(pk,12),sid=u16(pk,14);return (((pid^(pid>>>16)^tid^sid)&0xffff)<8)}
function makeShiny(pk,on){var old=u32(pk,0),tid=u16(pk,12),sid=u16(pk,14),nature=old%25;for(var hi=0;hi<65536;hi++){for(var target=on?0:8;target<(on?8:9);target++){var lo=(hi^tid^sid^target)&0xffff;var pid=((hi<<16)|lo)>>>0;if(pid%25===nature){w32(pk,0,pid);return true}}}return false}
var SPECIES_URL='https://raw.githubusercontent.com/sindresorhus/pokemon/main/data/zh-hant.json';
var CSV_URLS={move:'https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/move_names.csv',item:'https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/item_names.csv',ability:'https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/ability_names.csv'};
var ABILITY_URL='https://raw.githubusercontent.com/PokeAPI/pokeapi/master/data/v2/csv/pokemon_abilities.csv';
var speciesAbilities={};
var API='https://pokeapi.co/api/v2/';
var speciesNames=[],resourceCache={},resourceMaps={move:{},item:{},ability:{}},resourceReverse={move:{},item:{},ability:{}};
async function loadNames(){try{var r=await fetch(SPECIES_URL,{cache:'force-cache'});speciesNames=await r.json()}catch(e){speciesNames=[]}}
function speciesName(id){return speciesNames[id-1]||('寶可夢 #'+id)}
function spriteUrl(id,isShiny=false){return `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-iv/heartgold-soulsilver/${isShiny?'shiny/':''}${id}.png`}
function parseCSVLine(line){var out=[];var cur='',quoted=false;for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){if(quoted&&line[i+1]==='"'){cur+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
async function loadResourceMap(kind){try{var r=await fetch(CSV_URLS[kind],{cache:'force-cache'});var text=await r.text();var map=resourceMaps[kind],rev=resourceReverse[kind];for(var line of text.split(/\r?\n/).slice(1)){if(!line)continue;var [id,lang,zhName]=parseCSVLine(line);if(+lang!==4||!id||!zhName)continue;var n=zhName.trim();map[+id]=n;rev[n.toLowerCase()]=+id}}catch(e){}}
async function loadAbilityMap(){try{var r=await fetch(ABILITY_URL,{cache:'force-cache'});var text=await r.text();for(var line of text.split(/\r?\n/).slice(1)){if(!line)continue;var parts=parseCSVLine(line);var sid=+parts[0],aid=+parts[1],slot=+parts[2],hidden=String(parts[3]).toLowerCase()==='true';if(!sid||!aid||sid>493||hidden||slot>2)continue;var arr=speciesAbilities[sid]||(speciesAbilities[sid]=[]);if(arr.indexOf(aid)<0)arr.push(aid)}}catch(e){}}
async function loadResources(){await Promise.all(Object.keys(CSV_URLS).map(loadResourceMap));await loadAbilityMap()}
function resourceName(kind,id){if(!id)return kind==='item'?'無':kind==='move'?'—':'未知';return resourceMaps[kind][id]||resourceCache[kind+':'+id]||('#'+id)}
async function resourceNameRemote(kind,id){if(!id)return resourceName(kind,id);var key=kind+':'+id;if(resourceCache[key])return resourceCache[key];try{var r=await fetch(API+kind+'/'+id);var j=await r.json();var n=(j.names||[]).find(x=>/zh-hant|zh-Hant/i.test(x.language?.name||''))||(j.names||[]).find(x=>(x.language?.name||'')==='zh-tw')||(j.names||[]).find(x=>(x.language?.name||'')==='en');var v=n?.name||j.name||('#'+id);resourceCache[key]=v;return v}catch(e){return resourceName(kind,id)}}
function displayResource(kind,id){return `<span class="resource"><span class="pill">${kind==='move'?'⚔️':kind==='item'?'🎒':'✨'} ${esc(resourceName(kind,id))}</span><span class="idtag">#${id}</span></span>`}
var ITEM_FALLBACK={1:'大師球',2:'高級球',3:'超級球',4:'精靈球',5:'狩獵球',6:'捕網球',7:'潛水球',8:'巢穴球',9:'重複球',10:'計時球',11:'豪華球',12:'紀念球',13:'回復藥',14:'解毒藥',15:'灼傷藥',16:'冰醒藥',17:'解麻藥',18:'解凍藥',19:'全復藥',20:'活力碎片',21:'活力塊',22:'萬靈藥',23:'傷藥',24:'好傷藥',25:'厲害傷藥',26:'超級傷藥',27:'特級傷藥',28:'全滿藥',29:'全滿回復',30:'精靈球',31:'奇異甜食',32:'解毒果',33:'灼傷果',34:'冰凍果',35:'解麻果',36:'解眠果',37:'解混亂果',38:'解咒果',39:'莓榴果',40:'藍橘果',41:'葡萄果',42:'茄番果',43:'哈密果',44:'萄葡果',45:'玉黍果',46:'茸丹果',47:'靛莓果',48:'蕉柑果',49:'異奇果',50:'橙橙果',51:'櫻子果',52:'零餘果',53:'桃桃果',54:'莓莓果',55:'利木果',56:'香柚果',57:'芭亞果',58:'蔓莓果',59:'勿花果',60:'文柚果',61:'椰木果',62:'榴石果',63:'藻根果',64:'比巴果',65:'奇異果',66:'羅子果',67:'瓜西果',68:'榴石果',69:'藻根果',70:'比巴果',71:'哈密果',72:'萄葡果',73:'茄番果',74:'玉黍果',75:'茸丹果',76:'靛莓果',77:'蕉柑果',78:'洛玫果',79:'芭樂果',80:'番茄果'};
function itemLabel(id){return resourceMaps.item[id]||ITEM_FALLBACK[id]||('道具 #'+id)}
function abilityLabel(id){return resourceMaps.ability[id]||('特性 #'+id)}
function abilityOptions(speciesId,currentAbility){var ids=speciesAbilities[speciesId]||[];var h='';if(ids.length){var found=ids.indexOf(+currentAbility);if(found<0&&currentAbility){h+='<option value="'+currentAbility+'" selected>目前特性：'+esc(abilityLabel(currentAbility))+' #'+currentAbility+'</option>'}for(var j=0;j<ids.length;j++){var aid=ids[j];h+='<option value="'+aid+'" '+(aid===+currentAbility?'selected':'')+'>'+esc(abilityLabel(aid))+' #'+aid+'</option>'}}else{h='<option value="'+(+currentAbility||0)+'" selected>'+esc(abilityLabel(+currentAbility||0))+' #'+(+currentAbility||0)+'</option>'}return h}
function resourceInput(kind,key,id,speciesId){var label=kind==='move'?'招式':'道具';if(kind==='ability')label='特性';var list=kind+'-list';if(kind==='item'){var h='<div class="field"><label>'+label+'</label><select data-k="'+key+'" data-default="'+id+'">';h+='<option value="0" '+(id===0?'selected':'')+'>無 #0</option>';for(var n=1;n<=600;n++){var nm=itemLabel(n);h+='<option value="'+n+'" '+(n===id?'selected':'')+'>'+esc(nm)+' #'+n+'</option>'}h+='</select><div class="hint">直接點選道具；目前 ID：#'+id+'</div></div>';return h}if(kind==='ability'){return '<div class="field"><label>'+label+'</label><select data-k="ability" data-default="'+id+'" id="ability-select">'+abilityOptions(speciesId,id)+'</select><div class="hint">只顯示 HGSS 可用的普通特性；內部寫入 Gen4 的特性欄位（0=第一特性、1=第二特性）</div></div>'}return '<div class="field"><label>'+label+'</label><div class="resourceinput"><input data-k="'+key+'" data-default="'+id+'" list="'+list+'" type="text" value="'+esc(resourceName(kind,id))+'" placeholder="輸入名稱或 ID"><span class="idtag">#'+id+'</span></div><div class="hint">可輸入繁中名稱或編號</div></div>'}
function parseResourceValue(kind,val,def){var q=String(val||'').trim();if(/^#?\d+$/.test(q))return Math.max(0,+q);var id=resourceReverse[kind][q.toLowerCase()];return id??(+def||0)}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function nameToIdValue(v,def){var q=String(v||'').trim();if(/^#?\d+$/.test(q))return Math.max(0,+q);var n=speciesNames.findIndex(x=>String(x).toLowerCase()===q.toLowerCase());return n>=0?n+1:(+def||0)}
function buildResourceLists(){for(var kind of ['move','item','ability']){var dl=document.getElementById(kind+'-list');if(!dl)continue;dl.innerHTML='';var max=kind==='move'?467:kind==='item'?600:123;for(var i=1;i<=max;i++){var n=resourceMaps[kind][i];if(!n)continue;var o=document.createElement('option');o.value=n;o.label='#'+i;dl.appendChild(o)}}}
function hydrateResources(){document.querySelectorAll('[data-res]').forEach(el=>{var [k,id]=el.dataset.res.split(':');el.innerHTML=displayResource(k,+id)})}
function render(){renderParty();renderBoxes();renderTrainer();renderBag();hydrateResources()}
function renderParty(){var count=data[0x94];var h=`<div class="card"><div class="row"><div><b>目前隊伍</b><div class="muted small">${count} / 6 隻</div></div><span class="pill">HGSS 512 KB</span></div><div class="slotgrid" style="margin-top:10px">`;for(var i=0;i<6;i++){var pk=getPK('party',i,0),s=species(pk),exists=present(pk);h+=`<button class="slot ${sel.type==='party'&&sel.i===i?'sel':''}" onclick="pick('party',${i})">${exists?`<img class="slotimg" src="${spriteUrl(s,shiny(pk))}" onerror="this.style.visibility='hidden'">`:''}<b>第 ${i+1} 格</b><br>${exists?speciesName(s):'空位'}<br><span class="muted small">${exists?'#'+s+(shiny(pk)?' · ✨':''):''}</span></button>`}h+='</div></div>';if(sel.type==='party')h+=editor('party',sel.i);$('#party').innerHTML=h}
function renderBoxes(){var h=`<div class="card"><div class="boxbar"><b>PC 盒子</b><select onchange="box=+this.value;sel={type:'box',i:box*30};renderBoxes();hydrateResources()">`;for(var b=0;b<18;b++)h+=`<option value="${b}" ${b===box?'selected':''}>盒子 ${b+1}</option>`;h+='</select></div><div class="slotgrid" style="margin-top:10px">';for(var s=0;s<30;s++){var idx=box*30+s,pk=getPK('box',idx,0),sp=species(pk),exists=present(pk);h+=`<button class="slot ${sel.type==='box'&&sel.i===idx?'sel':''}" onclick="pick('box',${idx})">${exists?`<img class="slotimg" src="${spriteUrl(sp,shiny(pk))}" onerror="this.style.visibility='hidden'">`:''}<b>${s+1}</b><br>${exists?speciesName(sp):'空'}</button>`}h+='</div></div>';if(sel.type==='box')h+=editor('box',sel.i);$('#boxes').innerHTML=h}
function pick(t,i){sel={type:t,i};if(t==='box')box=Math.floor(i/30);render();show(t==='box'?'boxes':'party')}
window.pick=pick;
function editor(t,i){var pk=getPK(t,i,0),exists=present(pk),sp=species(pk),iv=ivs(pk),ev=[pk[0x18],pk[0x19],pk[0x1a],pk[0x1b],pk[0x1c],pk[0x1d]],moves=[0x28,0x2a,0x2c,0x2e].map(o=>u16(pk,o)),item=u16(pk,0x0a),ability=pk[0x15];var title=exists?speciesName(sp):'建立寶可夢';return `<div class="card"><div class="pokehead">${exists?`<img class="pokeimg" src="${spriteUrl(sp,shiny(pk))}" onerror="this.style.display='none'">`:''}<div><div class="name">${title}</div><div class="idline">${exists?'全國圖鑑 #'+sp:'尚未建立'} ${exists&&shiny(pk)?' · ✨ 閃光':''}</div></div></div><div class="row"><div><b>${exists?'編輯':'建立'}寶可夢</b><div class="muted small">${t==='party'?'隊伍第 '+(i+1)+' 格':'盒子 '+(box+1)+'／第 '+(i%30+1)+' 格'}</div></div></div><div class="grid" style="margin-top:12px"><div class="field"><label>寶可夢</label><input data-k="species" data-default="${sp}" list="species-list" type="text" value="${esc(speciesName(sp))}" placeholder="輸入中文名稱或圖鑑編號"><div class="hint">可輸入中文名稱，例如：皮卡丘、烈咬陸鯊</div></div>${resourceInput('item','item',item)}${field('EXP','exp',u32(pk,0x10),0,4294967295)}${resourceInput('ability','ability',ability,sp)}${field('親密度','friend',pk[0x14],0,255)}${field('TID','tid',u16(pk,0x0c),0,65535)}${field('SID','sid',u16(pk,0x0e),0,65535)}${moves.map((m,j)=>resourceInput('move','m'+(j+1),m)).join('')}</div><div class="card"><b>IV</b><div class="grid3" style="margin-top:8px">${['HP','攻','防','速','特攻','特防'].map((n,j)=>field(n,'iv'+j,iv[j],0,31)).join('')}</div></div><div class="card"><b>EV</b><div class="grid3" style="margin-top:8px">${['HP','攻','防','速','特攻','特防'].map((n,j)=>field(n,'ev'+j,ev[j],0,255)).join('')}</div></div><div class="actions"><button class="btn primary" onclick="apply('${t}',${i})">✅ 套用</button><button class="btn" onclick="toggleShiny('${t}',${i},true)">✨ 閃光</button><button class="btn" onclick="toggleShiny('${t}',${i},false)">取消閃光</button><button class="btn danger" onclick="clearSlot('${t}',${i})">清空</button></div></div>`}
window.apply=function(t,i){var f={};var root=t==='party'?$('#party'):$('#boxes');root.querySelectorAll('[data-k]').forEach(e=>{var k=e.dataset.k;if(k==='species')f[k]=nameToIdValue(e.value,e.dataset.default);else if(k==='item')f[k]=parseResourceValue('item',e.value,e.dataset.default);else if(k==='ability')f[k]=+e.value;else if(/^m[1-4]$/.test(k))f[k]=parseResourceValue('move',e.value,e.dataset.default);else f[k]=+e.value});var pk=getPK(t,i,0);if(!present(pk)){crypto.getRandomValues(pk);w32(pk,0,(Math.random()*0xffffffff)>>>0);w16(pk,4,0);w16(pk,12,u16(data,0x74));w16(pk,14,u16(data,0x76));}w16(pk,8,f.species);w16(pk,0x0a,f.item);w32(pk,0x10,f.exp>>>0);pk[0x15]=f.ability&255;pk[0x14]=f.friend&255;w16(pk,0x0c,f.tid);w16(pk,0x0e,f.sid);[0x28,0x2a,0x2c,0x2e].forEach((o,j)=>w16(pk,o,f['m'+(j+1)]));var v=(f.iv0&31)|((f.iv1&31)<<5)|((f.iv2&31)<<10)|((f.iv3&31)<<15)|((f.iv4&31)<<20)|((f.iv5&31)<<25);w32(pk,0x38,v>>>0);['ev0','ev1','ev2','ev3','ev4','ev5'].forEach((k,j)=>pk[0x18+j]=f[k]&255);fixPK(pk);setPK(t,i,pk);if(t==='party'){var n=Math.max(data[0x94],i+1);data[0x94]=n;data[PS+0x94]=n}saveBothChecksums();msg('已套用。請匯出存檔後再放回 Delta。');render()}
window.toggleShiny=function(t,i,on){var pk=getPK(t,i,0);if(!present(pk))return;var ok=makeShiny(pk,on);if(!ok){msg('閃光狀態修改失敗，請再試一次。');return}fixPK(pk);setPK(t,i,pk);saveBothChecksums();render();msg(on?'已設為閃光。':'已取消閃光')}
window.clearSlot=function(t,i){setPK(t,i,new Uint8Array(136));if(t==='party'&&i+1===data[0x94]){var n=0;for(var j=0;j<6;j++)if(present(getPK('party',j,0)))n=j+1;data[0x94]=n;data[PS+0x94]=n}saveBothChecksums();render();msg('已清空。')}
function renderTrainer(){var h='<div class="card"><b>玩家資料</b><div class="grid" style="margin-top:12px">'+field('TID','tid',u16(data,0x74))+field('SID','sid',u16(data,0x76))+field('金錢','money',u32(data,0x78),0,999999)+field('地圖 ID','map',u16(data,0x1234))+field('X','x',u16(data,0x236e))+field('Y','y',u16(data,0x2372))+field('Z','z',u16(data,0x2376))+'</div><div class="actions"><button class="btn primary" onclick="applyTrainer()">套用玩家資料</button></div></div>';$('#trainer').innerHTML=h}
window.applyTrainer=function(){var f={};$('#trainer').querySelectorAll('[data-k]').forEach(e=>f[e.dataset.k]=+e.value);w16(data,0x74,f.tid);w16(data,0x76,f.sid);w32(data,0x78,Math.min(999999,f.money));w16(data,0x1234,f.map);w16(data,0x236e,f.x);w16(data,0x2372,f.y);w16(data,0x2376,f.z);for(var off of [0,PS]){w16(data,off+0x74,f.tid);w16(data,off+0x76,f.sid);w32(data,off+0x78,Math.min(999999,f.money));w16(data,off+0x1234,f.map);w16(data,off+0x236e,f.x);w16(data,off+0x2372,f.y);w16(data,off+0x2376,f.z)}saveBothChecksums();render();msg('玩家資料已修改。')}
function renderBag(){var h='<div class="card"><b>🎒 背包</b><div class="notice">目前先保留金錢安全修改；下一階段可加入完整 HGSS 道具欄位與數量。</div><div class="grid" style="margin-top:12px">'+field('金錢','money',u32(data,0x78),0,999999)+'</div><div class="actions"><button class="btn primary" onclick="var v=Math.min(999999,Math.max(0,+document.querySelector(\'[data-k=money]\').value));w32(data,0x78,v);w32(data,PS+0x78,v);saveBothChecksums();msg(\'金錢已修改。\')">套用金錢</button></div></div>';$('#bag').innerHTML=h}
for(var id of ['species-list','move-list','item-list','ability-list']){var dl=document.createElement('datalist');dl.id=id;document.body.appendChild(dl)}
function buildSpeciesList(){var dl=$('#species-list');dl.innerHTML='';for(var i=1;i<=493;i++){var o=document.createElement('option');o.value=speciesNames[i-1]||String(i);o.label='#'+i;dl.appendChild(o)}}
function refreshAbilitySelect(root,speciesId,current){var sel=root.querySelector('#ability-select');if(!sel)return;sel.innerHTML=abilityOptions(speciesId,+current||0);sel.dataset.default=String(+current||0)}
document.addEventListener('change',function(e){if(!e.target||e.target.dataset.k!=='species')return;var sid=nameToIdValue(e.target.value,e.target.dataset.default);var root=e.target.closest('.card');if(!root)return;var current=+(root.querySelector('[data-k=ability]')?.value||0);refreshAbilitySelect(root,sid,current)})
Promise.all([loadNames(),loadResources()]).then(()=>{buildSpeciesList();buildResourceLists()});
function show(t){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));for(var id of ['party','boxes','trainer','bag'])$('#'+id).classList.toggle('hidden',id!==t)}$$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
document.getElementById('file').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;fileName=f.name;var reader=new FileReader();reader.onerror=function(){msg('載入失敗：iPhone 無法讀取這個檔案。')};reader.onload=function(){try{var buf=reader.result;if(!buf||buf.byteLength!==0x80000){msg('目前這版要求 512 KB HGSS 存檔；你選到的是 '+(buf?Math.round(buf.byteLength/1024):0)+' KB。');return}data=new Uint8Array(buf);original=new Uint8Array(buf.slice(0));if(scoreBase(0)<20&&scoreBase(PS)<20){msg('這個檔案不像 HGSS 512 KB 存檔。');return}document.getElementById('app').classList.remove('hidden');document.getElementById('export').disabled=false;document.getElementById('reset').disabled=false;sel={type:'party',i:0};Promise.all([loadNames(),loadResources()]).then(function(){buildSpeciesList();buildResourceLists();render();msg('已載入 '+fileName+'。隊伍數量：'+data[0x94]+'。現在可以點寶可夢修改。')}).catch(function(err){msg('資料名稱載入失敗：'+(err&&err.message?err.message:'未知錯誤'));buildSpeciesList();buildResourceLists();render()});}catch(err){msg('載入失敗：'+(err&&err.message?err.message:'未知錯誤'));}};reader.readAsArrayBuffer(f);});

$('#reset').onclick=()=>{if(original){data=original.slice();render();msg('已還原到載入時的原始存檔。')}};
$('#export').onclick=()=>{if(!data)return;saveBothChecksums();var blob=new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);var ext=fileName.toLowerCase().endsWith('.dsv')?'.dsv':'.sav';a.download='promax_edited'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);msg('已匯出 promax_edited'+ext+'。請保留原始存檔備份。')};
function msg(s,ok=true){$('#status').textContent=s;$('#status').classList.toggle('ok',ok);}
</script></body></html>
