function makePID(nat,slot,tid,sid,shinyWanted){

window.toggleShiny=function(t,i,on){try{var pk=getPK(t,i,0);if(!present(pk))throw Error('這一格沒有寶可夢。');var sp=species(pk),ids=speciesAbilities[sp]||[],slot=Math.max(0,ids.indexOf(pk[0x15]&255));if(slot>1)slot=0;var nat=natureIndex(pk);if(!syncNatureAbilityPID(pk,nat,slot,!!on))throw Error('閃光 PID 生成失敗。');fixPK(pk);setPK(t,i,pk);saveBothChecksums();render();msg(on?'已設為閃光。':'已取消閃光。')}catch(e){msg(e.message||'閃光修改失敗。',false)}}

function renderTrainer(){var h='<div class="card"><b>玩家資料</b><div class="grid" style="margin-top:12px">'+field('TID','tid',u16(data,0x74))+field('SID','sid',u16(data,0x76))+field('金錢','money',u32(data,0x78),0,999999)+field('地圖 ID','map',u16(data,0x1234))+field('X','x',u16(data,0x236E))+field('Y','y',u16(data,0x2372))+field('Z','z',u16(data,0x2376))+'</div><div class="actions"><button class="btn primary" onclick="applyTrainer()">套用玩家資料</button></div></div>';$('#trainer').innerHTML=h}
window.applyTrainer=function(){var f={};$('#trainer').querySelectorAll('[data-k]').forEach(e=>f[e.dataset.k]=+e.value);w16(data,0x74,f.tid);w16(data,0x76,f.sid);w32(data,0x78,Math.min(999999,f.money));w16(data,0x1234,f.map);w16(data,0x236E,f.x);w16(data,0x2372,f.y);w16(data,0x2376,f.z);for(var off of [0,PS]){w16(data,off+0x74,f.tid);w16(data,off+0x76,f.sid);w32(data,off+0x78,Math.min(999999,f.money));w16(data,off+0x1234,f.map);w16(data,off+0x236E,f.x);w16(data,off+0x2372,f.y);w16(data,off+0x2376,f.z)}saveBothChecksums();render();msg('玩家資料已修改。')}
var BAG_BASE=0x644;
var BAG_POCKETS=[
  ['一般物品',BAG_BASE+0x000,165],
  ['重要物品',BAG_BASE+0x294,50],
  ['TM／HM',BAG_BASE+0x35C,101],
  ['郵件',BAG_BASE+0x4F0,12],
  ['藥品',BAG_BASE+0x520,40],
  ['樹果',BAG_BASE+0x5C0,64],
  ['球類',BAG_BASE+0x6C0,24],
  ['戰鬥物品',BAG_BASE+0x720,24]
];
function bagPocketByName(name){return BAG_POCKETS.find(p=>p[0]===name)||BAG_POCKETS[0]}
function firstEmptyBagSlot(off,count){for(var i=0;i<count;i++){if(u16(data,off+i*4)===0)return i}return -1}
function renderBag(){
  let h=`<div class="card"><b>🎒 背包</b><div class="notice">已恢復 HGSS 完整背包區段：一般物品、重要物品、TM／HM、郵件、藥品、樹果、球類、戰鬥物品。可修改既有物品，也可直接新增任意物品到第一個空格。</div><div class="grid" style="margin-top:12px"><div class="field"><label>金錢</label><input id="bagMoney" type="number" min="0" max="999999" value="${u32(data,0x78)}"></div><button class="btn primary" onclick="setMoney(document.getElementById('bagMoney').value)">套用金錢</button></div>`;
  for(var p of BAG_POCKETS){
    var name=p[0],off=p[1],count=p[2],entries=[];
    for(var i=0;i<count;i++){var id=u16(data,off+i*4),qty=u16(data,off+i*4+2);if(id||qty)entries.push([i,id,qty])}
    h+=`<div class="card"><div class="row"><div><b>${name}</b><div class="muted small">${entries.length} 格有物品／共 ${count} 格</div></div><button class="btn primary" onclick="addBagItem(${off},${count})">➕ 新增物品</button></div>`;
    if(!entries.length)h+='<div class="notice" style="margin-top:8px">沒有物品；按「新增物品」即可加入。</div>';
    for(var e of entries){var idx=e[0],id=e[1],qty=e[2];h+=`<div class="grid" style="margin-top:8px"><div><b>${esc(itemLabel(id))}</b><div class="muted small">第 ${idx+1} 格｜ID #${id}</div></div><div class="grid3"><div class="field"><label>物品 ID</label><input data-bag-id="${off}:${idx}" type="number" min="0" max="65535" value="${id}"></div><div class="field"><label>數量</label><input data-bag-qty="${off}:${idx}" type="number" min="0" max="999" value="${qty}"></div><button class="btn" onclick="setOneBag(${off},${idx})">套用</button></div></div>`}
    h+='</div>'
  }
  h+='</div>';$('#bag').innerHTML=h
}
window.addBagItem=function(off,count){
  try{
    var idx=firstEmptyBagSlot(off,count);if(idx<0)throw Error('這個背包分類已沒有空格。');
    var raw=prompt('輸入物品 ID（例如 1）','1');if(raw===null)return;
    var id=Math.max(1,Math.min(65535,parseInt(raw,10)||0));if(!id)throw Error('物品 ID 無效。');
    var rawQty=prompt('輸入數量','1');if(rawQty===null)return;
    var qty=Math.max(1,Math.min(999,parseInt(rawQty,10)||0));
    for(var base of baseOffsets()){w16(data,base+off+idx*4,id);w16(data,base+off+idx*4+2,qty)}
    saveBothChecksums();render();show('bag');msg('已新增 '+itemLabel(id)+' #'+id+' × '+qty+'。');
  }catch(e){msg(e.message||'新增物品失敗。',false)}
}
window.setOneBag=function(off,idx){try{var id=+document.querySelector('[data-bag-id="'+off+':'+idx+'"]')?.value||0,qty=+document.querySelector('[data-bag-qty="'+off+':'+idx+'"]')?.value||0;id=Math.max(0,Math.min(65535,id));qty=Math.max(0,Math.min(999,qty));for(var base of baseOffsets()){w16(data,base+off+idx*4,id);w16(data,base+off+idx*4+2,qty)}saveBothChecksums();render();show('bag');msg('背包物品已修改。')}catch(e){msg(e.message||'背包修改失敗。',false)}}
window.setMoney=function(v){v=Math.max(0,Math.min(999999,+v||0));for(var base of baseOffsets())w32(data,base+0x78,v);saveBothChecksums();render();show('bag');msg('金錢已修改。')}
for(var id of ['species-list','move-list','item-list','ability-list']){var dl=document.createElement('datalist');dl.id=id;document.body.appendChild(dl)}
function buildSpeciesList(){var dl=$('#species-list');dl.innerHTML='';for(var i=1;i<=493;i++){var o=document.createElement('option');o.value=speciesNames[i-1]||String(i);o.label='#'+i;dl.appendChild(o)}}
function refreshAbilitySelect(root,speciesId,current){var sel=root.querySelector('#ability-select');if(!sel)return;sel.innerHTML=abilityOptions(speciesId,current);sel.dataset.default=String(current||0)}
document.addEventListener('change',function(e){if(!e.target||e.target.dataset.k!=='species')return;var sid=nameToIdValue(e.target.value,e.target.dataset.default);var root=e.target.closest('.card');if(!root)return;var current=+(root.querySelector('[data-k=ability]')?.value||0);refreshAbilitySelect(root,sid,current)})
Promise.all([loadNames(),loadResources()]).then(()=>{buildSpeciesList();buildResourceLists()});
function show(t){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));for(var id of ['party','boxes','trainer','bag'])$('#'+id).classList.toggle('hidden',id!==t)}$$('.tab').forEach(b=>b.onclick=()=>show(b.dataset.tab));
document.getElementById('file').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;fileName=f.name;var reader=new FileReader();reader.onerror=function(){msg('載入失敗：iPhone 無法讀取這個檔案。')};reader.onload=function(){try{var buf=reader.result;if(!buf||buf.byteLength!==0x80000){msg('目前這版要求 512 KB HGSS 存檔；你選到的是 '+(buf?Math.round(buf.byteLength/1024):0)+' KB。');return}data=new Uint8Array(buf);original=new Uint8Array(buf.slice(0));if(!cryptoRoundTripTest()){msg('Gen4 寶可夢加解密自我測試失敗，未載入存檔。',false);return}if(scoreBase(0)<20&&scoreBase(PS)<20){msg('這個檔案不像 HGSS 512 KB 存檔。');return}document.getElementById('app').classList.remove('hidden');document.getElementById('export').disabled=false;document.getElementById('reset').disabled=false;sel={type:'party',i:0};Promise.all([loadNames(),loadResources()]).then(function(){buildSpeciesList();buildResourceLists();render();msg('已載入 '+fileName+'。隊伍數量：'+data[0x94]+'。現在可以點寶可夢修改。')}).catch(function(err){msg('資料名稱載入失敗：'+(err&&err.message?err.message:'未知錯誤'));buildSpeciesList();buildResourceLists();render()});}catch(err){msg('載入失敗：'+(err&&err.message?err.message:'未知錯誤'));}};reader.readAsArrayBuffer(f);});

$('#reset').onclick=()=>{if(original){data=original.slice();render();msg('已還原到載入時的原始存檔。')}};
$('#export').onclick=()=>{if(!data)return;saveBothChecksums();var blob=new Blob([data],{type:'application/octet-stream'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);var ext=fileName.toLowerCase().endsWith('.dsv')?'.dsv':'.sav';a.download='promax_HGSS_v24_edited'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);msg('已匯出 promax_HGSS_v24_edited'+ext+'。請保留原始存檔備份。')};
function msg(s,ok=true){$('#status').textContent=s;$('#status').classList.toggle('ok',ok);}

</script></body></html>
